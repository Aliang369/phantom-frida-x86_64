name: nx-x86_64
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      ARCHITECTURES: android-x86_64
      CUSTOM_NAME: nxcodec
      CUSTOM_PORT: 27042
      EXTENDED_PATCHES: true
      FRIDA_VERSION: 17.16.4
      NDK_ARCHIVE_SHA1: 87e2bb7e9be5d6a1c6cdf5ec40dd4e0c6d07c30b
      NDK_ARCHIVE_URL: https://dl.google.com/android/repository/android-ndk-r29-linux.zip
      STRICT_WX: true
      TEMPORARY_FIXES: false

    steps:
      - name: Check out builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.13.1"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl git unzip

      - name: Restore immutable NDK
        id: ndk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/android-ndk-r29
          key: android-ndk-r29-linux-87e2bb7e9be5d6a1c6cdf5ec40dd4e0c6d07c30b

      - name: Download and verify NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          archive="$RUNNER_TEMP/android-ndk-r29-linux.zip"
          mkdir -p build
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$archive" "$NDK_ARCHIVE_URL"
          printf '%s  %s\n' "$NDK_ARCHIVE_SHA1" "$archive" | sha1sum --check -
          unzip -q "$archive" -d build

      - name: Validate NDK installation
        run: |
          grep -Fqx 'Pkg.Revision = 29.0.14206865' \
            build/android-ndk-r29/source.properties

      - name: Apply patches and build
        run: |
          command=(
            python3 build.py
            --version "$FRIDA_VERSION"
            --name "$CUSTOM_NAME"
            --arch "$ARCHITECTURES"
            --ndk-path build/android-ndk-r29
            --verify
          )

          if [[ -n "$CUSTOM_PORT" ]]; then
            command+=(--port "$CUSTOM_PORT")
          fi
          if [[ "$EXTENDED_PATCHES" == "true" ]]; then
            command+=(--extended)
          fi
          if [[ "$TEMPORARY_FIXES" == "true" ]]; then
            command+=(--temp-fixes)
          fi
          if [[ "$STRICT_WX" == "true" ]]; then
            command+=(--strict-wx)
          fi

          printf 'Running:'
          printf ' %q' "${command[@]}"
          printf '\n'
          "${command[@]}"

      - name: Verify release assets
        run: |
          python3 -m json.tool output/build-info.json > /dev/null
          cd output
          sha256sum --check SHA256SUMS

      - name: Upload verified build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phantom-frida-build
          path: output/
          if-no-files-found: error
          retention-days: 30
